<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Paris Saint-Germain crest</title>
  <desc id="desc">Original stylized circular Paris Saint-Germain style crest: navy disc, red ring, white wordmark, Eiffel tower and gold fleur-de-lis.</desc>

  <!-- Disc + rings -->
  <circle cx="256" cy="256" r="250" fill="#0a1f4d"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#d3122a" stroke-width="34"/>
  <circle cx="256" cy="256" r="174" fill="#0a1f4d"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>

  <!-- Wordmark ring -->
  <text x="256" y="60" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="7">PARIS</text>
  <text x="256" y="468" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="3">SAINT-GERMAIN</text>

  <!-- Eiffel tower silhouette -->
  <g fill="#d3122a">
    <path d="M256 112
             L246 168 L266 168 Z"/>
    <path d="M244 170 L268 170 L286 250 L274 250 L262 206 256 206 256 206 250 206 238 250 226 250 Z"/>
    <path d="M270 252 L300 344 L284 344 L274 300 256 300 238 300 228 344 212 344 242 252 Z"/>
    <rect x="247" y="110" width="18" height="8"/>
    <rect x="232" y="248" width="48" height="10"/>
    <rect x="222" y="300" width="68" height="10"/>
  </g>
  <path fill="#ffffff" opacity="0.92" d="M256 196 L274 286 H238 Z"/>
  <path d="M214 344 Q256 322 298 344" fill="none" stroke="#d3122a" stroke-width="9"/>

  <!-- Gold cradle + fleur-de-lis -->
  <ellipse cx="256" cy="372" rx="58" ry="40" fill="#f4c542"/>
  <ellipse cx="256" cy="372" rx="58" ry="40" fill="none" stroke="#caa12f" stroke-width="3"/>
  <g fill="#0a1f4d">
    <path d="M256 344c8 0 14 7 14 16 0 11-6 20-14 28-8-8-14-17-14-28 0-9 6-16 14-16z"/>
    <path d="M232 372c0-9 8-15 16-13-6 6-7 14-3 22-8 0-13-3-13-9z"/>
    <path d="M280 372c0-9-8-15-16-13 6 6 7 14 3 22 8 0 13-3 13-9z"/>
    <rect x="248" y="386" width="16" height="14" rx="3"/>
  </g>

  <!-- Year tab -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="3">1970</text>
</svg>
